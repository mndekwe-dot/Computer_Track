server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every portal route is client side. Without this, opening
    # /registry/students directly - or refreshing it - is a 404 from nginx,
    # because there is no such file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so these can be cached hard. index.html must not be:
    # it is what points at the current hashes, and a cached one pins a browser
    # to a deployment that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Crawlers ask for these on every visit; answering from disk without a
    # log line keeps them out of the way.
    location = /robots.txt { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Belt and braces beside Django's own headers: nginx serves the HTML, so
    # these have to be set here too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
}
